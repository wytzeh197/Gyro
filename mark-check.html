        color: #ddd;

      .panel {
        padding: 16px;

        background: #202124;
      }
      .light {

        color: #333;
      }
      /* Same rules as .gyro-provider-logo / svg in packages/ui/src/styles.css. */

        display: inline-grid;
        align-items: center;
        justify-items: center;
        height: 19px;
        width: 19px;
        line-height: 0;
      }
      .gyro-provider-logo svg {
        display: block;
        height: 100%;
        width: 100%;
      }
      .big {
        height: 64px;
        width: 64px;
      }
      .well {
        height: 40px;
        width: 40px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 12px;
      }
