<!doctype html><html><head><meta charset="UTF-8"><title>Gyro design QA — synthetic fixtures only</title><style>body{margin:0;background:#333;color:white;font:13px system-ui}nav{padding:8px;display:flex;gap:6px;flex-wrap:wrap}button,select{font:inherit;padding:5px}#frame{border:0;transform-origin:top left;background:#141415}#stage{margin:0 8px}#status{padding:4px 8px}details{padding:8px}pre{white-space:pre-wrap}</style></head><body><nav><select id="scene" aria-label="QA surface"></select><button id="prev">Previous state</button><button id="next">Next state</button><button data-w="860" data-h="620">860×620</button><button data-w="1280" data-h="800">1280×800</button><button data-w="2560" data-h="1440">2560×1440</button><button id="inspect">Measure overflow</button></nav><nav id="direct"></nav><div id="status"></div><div id="stage"><iframe id="frame" title="Synthetic Gyro fixture"></iframe></div><details><summary>Layout measurements</summary><pre id="output"></pre></details><script>
const base='/qa-artifacts-2026-11-17/capture.html?theme=dark&review=0&reset=1&tour=skip';
const scenes=[['Chat empty · 0 sessions',base+'&scene=welcome&qaSessions=0'],['Chat full · 50 sessions',base+'&scene=active-chat&edge=rich-response&qaSessions=50'],['Chat split',base+'&scene=active-chat&edge=split&qaSessions=50'],['Chat stacked',base+'&scene=active-chat&edge=stacked'],['Chat streaming',base+'&scene=active-chat&edge=streaming'],['Terminal full','/qa-artifacts-2026-11-17/terminal.html?theme=dark&sessions=1'],['Terminal empty','/qa-artifacts-2026-11-17/terminal.html?theme=dark&sessions=1&empty=1'],['Workspace empty file',base+'&scene=workspace-source-control&qaFile=empty'],['Workspace huge file · 50000 lines',base+'&scene=workspace-source-control&qaFile=huge'],['Settings General','/settings-preview.html?theme=dark&section=general'],['Settings Appearance','/settings-preview.html?theme=dark&section=appearance'],['Settings Providers','/settings-preview.html?theme=dark&section=providers'],['Settings Usage','/settings-preview.html?theme=dark&section=usage-limits'],['Remote Control','/remote-access-preview.html?theme=dark'],['Terminal renderer','/qa-artifacts-2026-11-17/terminal-live.html']];
let w=860,h=620;const frame=document.getElementById('frame'),sel=document.getElementById('scene');scenes.forEach(([name],i)=>sel.add(new Option(name,i)));function size(){frame.style.width=w+'px';frame.style.height=h+'px';const scale=Math.min(1,(innerWidth-16)/w,(innerHeight-205)/h);frame.style.transform=`scale(${scale})`;document.getElementById('stage').style.height=(h*scale)+'px';document.getElementById('status').textContent=`${scenes[sel.selectedIndex][0]} | viewport ${w}×${h} CSS px | display scale ${scale.toFixed(3)} | production components, synthetic data`;}
scenes.forEach(([name],i)=>{const b=document.createElement('button');b.textContent=i+': '+name;b.onclick=()=>{sel.selectedIndex=i;load()};document.getElementById('direct').append(b)});function load(){frame.src=scenes[sel.selectedIndex][1];size();}sel.onchange=load;document.getElementById('prev').onclick=()=>{sel.selectedIndex=Math.max(0,sel.selectedIndex-1);load()};document.getElementById('next').onclick=()=>{sel.selectedIndex=Math.min(scenes.length-1,sel.selectedIndex+1);load()};document.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{w=+b.dataset.w;h=+b.dataset.h;size()});onresize=size;document.getElementById('inspect').onclick=()=>{const d=frame.contentDocument; const findings=[...d.querySelectorAll('button,input,select,textarea,[role="tab"],h1,h2,h3,.gyro-sidebar-thread-title,.gyro-sidebar-thread-main,.gyro-composer-bar')].map(e=>{const r=e.getBoundingClientRect(),s=frame.contentWindow.getComputedStyle(e);return {class:e.className,text:(e.getAttribute('aria-label')||e.textContent||'').slice(0,85),x:r.x,y:r.y,w:r.width,h:r.height,scroll:e.scrollWidth,client:e.clientWidth,font:s.fontSize,line:s.lineHeight,gap:s.gap,overflow:s.overflow}}).filter(e=>e.w&&e.h&&(e.x<0||e.x+e.w>w+1||e.scroll>e.client+3||/gyro-sidebar-thread|gyro-settings-input|gyro-composer-bar|explorer-toolbar/.test(e.class)));document.getElementById('output').textContent=JSON.stringify(findings,null,2);document.querySelector('details').open=true;};load();</script></body></html>
