[package]
autobins = false
name = "gyro-desktop"
default-run = "gyro-desktop"
description = "Gyro macOS desktop application."
build = "build.rs"
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lib]
name = "gyro_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Explicit native acceptance/review builds. Fixture binaries embed smoke-mode
# assets; shell review pins a temporary store before normal app startup.
[features]
native-syntax-smoke = ["tauri/custom-protocol"]
native-chat-drag-smoke = ["tauri/custom-protocol"]
native-browser-events-smoke = ["tauri/custom-protocol"]
native-browser-shell-review = ["tauri/custom-protocol"]

[[bin]]
name = "gyro-desktop"
path = "src/main.rs"

[[bin]]
name = "gyro-workspace-syntax-smoke"
path = "src/bin/workspace-syntax-smoke.rs"
required-features = ["native-syntax-smoke"]

[[bin]]
name = "gyro-chat-drag-smoke"
path = "src/bin/chat-drag-smoke.rs"
required-features = ["native-chat-drag-smoke"]

[[bin]]
name = "gyro-browser-events-smoke"
path = "src/bin/browser-events-smoke.rs"
required-features = ["native-browser-events-smoke"]

[[bin]]
name = "gyro-browser-shell-review"
path = "src/bin/browser-shell-review.rs"
required-features = ["native-browser-shell-review"]

[build-dependencies]
tauri-build = { version = "2.2", features = [] }

[dependencies]
anyhow.workspace = true
base64.workspace = true
chrono.workspace = true
gyro-core = { path = "../../../crates/gyro-core" }
libc.workspace = true
notify.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
chacha20poly1305 = "0.10.1"
zstd = { version = "0.13.3", default-features = false }
keyring.workspace = true
portable-pty = "0.9"
tauri = { version = "2.5", features = ["image-png", "macos-private-api", "protocol-asset", "tray-icon", "unstable"] }
tauri-plugin-dialog = "2.2"
tauri-plugin-notification = "2.3"
tauri-plugin-opener = "2.2"
tauri-plugin-updater = "2.8"
uuid.workspace = true
ureq.workspace = true
url.workspace = true
walkdir = "2.5"
tempfile = "3.10"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
notify-rust = "4.18"
objc2 = "0.6"
objc2-core-graphics = { version = "0.3", features = ["CGEvent", "CGEventTypes"] }
objc2-app-kit = { version = "0.3", features = ["NSBitmapImageRep", "NSButton", "NSControl", "NSEvent", "NSGraphicsContext", "NSImage", "NSImageRep", "NSResponder", "NSScrollView", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3", features = ["NSData", "NSDictionary", "NSError", "NSNotification", "NSOperation", "NSString", "NSGeometry", "block2"] }
objc2-web-kit = { version = "0.3", features = ["WKSnapshotConfiguration", "WKWebView", "block2"] }
