<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/gyro-logo.png" />
    <meta name="theme-color" content="#101010" />
    <title>Gyro</title>
    <style>
      /* Quiet themed canvas only — no boot gate. First paint is the early
         chat shell from main.tsx. */
      html,
      body {
        background: #0b0c0e;
        color: #e8e8e8;
        height: 100%;
        margin: 0;
      }
      #root {
        min-height: 100%;
      }
      html[data-theme="light"],
      html[data-theme="light"] body {
        background: #f6f7f8;
        color: #1d2329;
      }
    </style>
    <script>
      try {
        var theme =
          localStorage.getItem("gyro.theme") === "light" ? "light" : "dark";
        document.documentElement.dataset.theme = theme;
        document
          .querySelector('meta[name="theme-color"]')
          ?.setAttribute("content", theme === "light" ? "#f6f7f8" : "#101010");
      } catch (_) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
