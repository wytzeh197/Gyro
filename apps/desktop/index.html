<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/gyro-logo.png" />
    <meta name="theme-color" content="#101010" />
    <title>Gyro</title>
    <style>
      /* Visible shell before JS bundles; avoids pure white WebView on cold start. */
      html,
      body {
        background: #101010;
        color: #e8e8e8;
        height: 100%;
        margin: 0;
      }
      #root {
        min-height: 100%;
      }
      #gyro-boot {
        align-items: center;
        display: flex;
        flex-direction: column;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        gap: 10px;
        justify-content: center;
        min-height: 100vh;
        opacity: 0.72;
        padding: 24px;
        text-align: center;
      }
      #gyro-boot strong {
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.01em;
      }
      #gyro-boot span {
        color: #9a9a9a;
        font-size: 13px;
        max-width: 28rem;
      }
      :root[data-theme="light"] html,
      :root[data-theme="light"] body,
      html[data-theme="light"],
      body:has(:root[data-theme="light"]) {
        background: #f6f7f8;
        color: #1d2329;
      }
    </style>
    <script>
      try {
        var theme =
          localStorage.getItem("gyro.theme") === "light" ? "light" : "dark";
        document.documentElement.dataset.theme = theme;
        document
          .querySelector('meta[name="theme-color"]')
          ?.setAttribute("content", theme === "light" ? "#f6f7f8" : "#101010");
      } catch (_) {}
    </script>
  </head>
  <body>
    <div id="root">
      <div id="gyro-boot" role="status" aria-live="polite">
        <strong>Starting Gyro…</strong>
        <span>Loading the desktop shell. First cold start can take a moment.</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
