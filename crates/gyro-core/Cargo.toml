[package]
name = "gyro-core"
description = "Shared local-first engine for Gyro sessions, tools, config, and app IPC."
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
anyhow.workspace = true
base64.workspace = true
chrono.workspace = true
chrono-tz = "0.10"
dirs.workspace = true
diffy.workspace = true
dom_query = { version = "=0.27.0", default-features = false }
keyring.workspace = true
libc.workspace = true
rand.workspace = true
regex = "1.10"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros", "net", "sync"] }
rusqlite = { version = "0.41", features = ["bundled", "fallible_uint", "backup"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile = "3.10"
thiserror.workspace = true
ureq.workspace = true
unicode-normalization = "0.1"
url.workspace = true
uuid.workspace = true
