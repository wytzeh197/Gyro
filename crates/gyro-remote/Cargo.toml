[package]
name = "gyro-remote"
description = "Experimental authenticated Gyro device transport"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
anyhow.workspace = true
base64.workspace = true
iroh = { version = "=1.4.1", default-features = false, features = ["tls-ring", "portmapper", "fast-apple-datapath"] }
iroh-mdns-address-lookup = "0.6.1"
rand.workspace = true
rusqlite = { version = "0.41", features = ["bundled", "fallible_uint"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle = "2.6"
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros", "net", "sync", "io-util"] }
uuid.workspace = true

[dev-dependencies]
tempfile = "3.10"
iroh-relay = { version = "=1.4.1", default-features = false, features = ["server", "tls-ring"] }
