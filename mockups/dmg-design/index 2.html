<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gyro — DMG install window, four directions</title>
<style>
  :root{
    --page:#08080a; --panel:#101014; --panel2:#15151a; --text:#ececf1; --muted:#8e8e9c;
    --hair:rgba(255,255,255,.09); --hair2:rgba(255,255,255,.05);
    --accent:#78a9ff; --ok:#3ddc84; --warn:#ffb454;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:
      radial-gradient(1200px 600px at 78% -12%,rgba(120,169,255,.08),transparent 60%),
      radial-gradient(900px 500px at 8% 110%,rgba(255,180,84,.05),transparent 60%),
      var(--page);
    color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column;height:100vh;overflow:hidden;
  }
  header.bar{
    display:flex;align-items:center;justify-content:space-between;gap:24px;
    padding:14px 24px;border-bottom:1px solid var(--hair);flex:none;flex-wrap:nowrap;
  }
  .brand{display:flex;gap:14px;align-items:flex-start}
  .brand .mark{
    width:26px;height:26px;border-radius:8px;margin-top:3px;
    background:linear-gradient(160deg,#2b2b33,#0f0f14);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.14),0 6px 18px rgba(0,0,0,.5);
    position:relative;flex:none;
  }
  .brand .mark::after{content:"";position:absolute;inset:7px;border-radius:50%;
    border:1.5px solid rgba(120,169,255,.85);border-right-color:transparent}
  h1{margin:0;font-size:15px;font-weight:600;letter-spacing:-.01em}
  .brand p{margin:4px 0 0;font-size:12.5px;color:var(--muted);letter-spacing:.005em}
  .controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .seg{display:flex;background:var(--panel);border:1px solid var(--hair);border-radius:9px;padding:2px}
  .seg button{
    appearance:none;border:0;background:transparent;color:var(--muted);font:inherit;font-size:12px;
    padding:6px 12px;border-radius:7px;cursor:pointer;transition:.15s;
  }
  .seg button.on{background:var(--panel2);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,255,255,.07)}
  .tg{
    appearance:none;font:inherit;font-size:12px;color:var(--muted);cursor:pointer;
    background:var(--panel);border:1px solid var(--hair);border-radius:9px;padding:7px 12px;transition:.15s;
  }
  .tg::before{content:"○ ";font-size:10px}
  .tg.on{color:var(--text);border-color:rgba(120,169,255,.45);background:rgba(120,169,255,.10)}
  .tg.on::before{content:"● ";color:var(--accent)}

  main{flex:1;display:grid;grid-template-columns:264px minmax(0,1fr);min-height:0;overflow:hidden}
  nav.rail{border-right:1px solid var(--hair);padding:18px 16px;display:flex;flex-direction:column;gap:8px;overflow:auto}
  .idea{
    appearance:none;text-align:left;font:inherit;cursor:pointer;color:var(--muted);
    background:transparent;border:1px solid transparent;border-radius:11px;padding:11px 12px;
    display:grid;grid-template-columns:26px 1fr;gap:10px;transition:.15s;
  }
  .idea:hover{background:rgba(255,255,255,.03)}
  .idea.on{background:var(--panel);border-color:var(--hair);color:var(--text)}
  .idea .n{font:500 11px/1.5 var(--mono);color:#5f5f6d;padding-top:2px}
  .idea.on .n{color:var(--accent)}
  .idea b{display:block;font-size:13px;font-weight:600;letter-spacing:-.005em;line-height:1.3}
  .idea small{display:block;font-size:11.5px;color:#767683;margin-top:3px;line-height:1.45}
  .rail .foot{margin-top:auto;padding:12px;font-size:11px;color:#6a6a78;line-height:1.6;border-top:1px solid var(--hair2)}
  .rail .foot code{font-family:var(--mono);font-size:10.5px;color:#9aa0ae}

  section.stage{padding:16px 24px 10px;display:grid;grid-template-rows:minmax(0,1fr) auto;min-width:0;min-height:0}
  .frame{display:grid;place-items:center;min-height:0;overflow:hidden}
  .scaler{position:relative}

  /* ---------- the DMG window ---------- */
  .window{
    width:660px;transform-origin:top left;border-radius:11px;overflow:hidden;
    box-shadow:0 40px 90px -30px rgba(0,0,0,.85),0 0 0 1px rgba(255,255,255,.10);
    background:#0c0c0e;
  }
  .chrome{
    height:38px;display:flex;align-items:center;gap:8px;padding:0 12px;
    background:linear-gradient(#1b1b1f,#17171b);border-bottom:1px solid rgba(0,0,0,.6);
    position:relative;
  }
  .lights{display:flex;gap:8px}
  .lights i{width:12px;height:12px;border-radius:50%;display:block}
  .lights i:nth-child(1){background:#ff5f57}.lights i:nth-child(2){background:#febc2e}.lights i:nth-child(3){background:#28c840}
  .chrome .t{
    position:absolute;left:0;right:0;text-align:center;font-size:12.5px;font-weight:600;
    color:#c9c9d2;letter-spacing:-.005em;pointer-events:none;
  }
  .finder{position:relative;width:660px;height:400px;overflow:hidden}
  .finder .art{position:absolute;inset:0}
  .slot{position:absolute;width:128px;text-align:center}
  .slot .glyph{width:128px;height:128px;position:relative}
  .slot img{width:128px;height:128px;display:block;filter:drop-shadow(0 8px 16px rgba(0,0,0,.45))}
  .slot .label{
    display:block;margin-top:10px;font-size:11.5px;line-height:1.2;letter-spacing:.002em;
    padding:1px 4px;border-radius:4px;
  }
  .theme-dark .slot .label{color:#f2f2f5;text-shadow:0 1px 3px rgba(0,0,0,.9)}
  .theme-light .slot .label{color:#1c1c1f}
  .finder.nolabels .label{opacity:0}

  /* palette per finder appearance */
  .theme-dark{--bg:#0b0b0e;--ink:#f4f4f8;--dim:rgba(244,244,248,.42);--line:rgba(255,255,255,.10);--dot:rgba(120,169,255,.16)}
  .theme-light{--bg:#f5f5f6;--ink:#0d0d10;--dim:rgba(13,13,16,.45);--line:rgba(0,0,0,.10);--dot:rgba(20,60,120,.18)}

  /* geometry overlay */
  .geo{position:absolute;inset:0;pointer-events:none;display:none}
  .finder.showgeo .geo{display:block}
  .geo rect{fill:none}
  .geo .safe{stroke:var(--accent);stroke-dasharray:5 4;stroke-width:1}
  .geo .own{stroke:var(--accent);stroke-opacity:.55;stroke-dasharray:3 3;stroke-width:1}
  .geo .band{fill:rgba(255,180,84,.10);stroke:rgba(255,180,84,.55);stroke-dasharray:3 3;stroke-width:1}
  .geo .dims{stroke:rgba(120,169,255,.5);stroke-width:1}
  .geo text{font-family:var(--mono);font-size:9px;fill:var(--accent)}
  .geo text.warn{fill:var(--warn)}

  /* meta panel */
  .meta{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;padding:16px 2px 6px;align-items:start}
  .meta h2{margin:0;font-size:14px;font-weight:600;letter-spacing:-.01em}
  .meta h2 span{font-family:var(--mono);font-size:11px;color:#5f5f6d;margin-right:8px}
  .meta .notes{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:9px;max-width:780px}
  .meta .notes p{margin:0;font-size:12.5px;line-height:1.62;color:#a8a8b6}
  .meta .notes b{color:var(--text);font-weight:600}
  .meta .notes .bad b{color:var(--warn)}
  .chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:330px}
  .chip{
    font-family:var(--mono);font-size:10.5px;color:#9aa0ae;background:var(--panel);
    border:1px solid var(--hair);border-radius:6px;padding:4px 8px;white-space:nowrap;
  }
  .variant{display:none;gap:4px;align-items:center;margin-top:12px}
  .variant.show{display:flex}
  .variant span{font-size:11px;color:var(--muted);margin-right:4px}
  .variant button{
    appearance:none;font:inherit;font-size:11px;cursor:pointer;padding:4px 9px;border-radius:6px;
    background:var(--panel);border:1px solid var(--hair);color:var(--muted);
  }
  .variant button.on{color:var(--text);border-color:rgba(120,169,255,.5);background:rgba(120,169,255,.12)}

  footer{border-top:1px solid var(--hair);height:50px;flex:none;display:flex;align-items:center;gap:14px;padding:0 28px}
  footer .lbl{font-size:10.5px;color:#6a6a78;text-transform:uppercase;letter-spacing:.1em;white-space:nowrap}
  footer .sp{flex:1}
  footer .kbd{font-family:var(--mono);font-size:10.5px;color:#5f5f6d;white-space:nowrap}
  footer button{
    appearance:none;font:inherit;font-size:11.5px;cursor:pointer;color:var(--muted);
    background:var(--panel);border:1px solid var(--hair);border-radius:8px;padding:7px 12px;white-space:nowrap;
  }
  footer button:hover{color:var(--text)}
  .drawer{
    position:fixed;left:28px;right:28px;bottom:60px;max-height:46vh;overflow:auto;z-index:20;display:none;
    background:#0d0d11;border:1px solid var(--hair);border-radius:12px;padding:14px 16px;
    box-shadow:0 30px 70px -20px #000,0 0 0 1px rgba(255,255,255,.03);
  }
  .drawer.open{display:block}
  pre{margin:0;font-family:var(--mono);font-size:11.5px;line-height:1.7;color:#c2c8d4;white-space:pre}
  pre .k{color:#8ea9d8}pre .s{color:#a8d5a2}pre .n{color:#e0b872}

  /* ==== art 01 : install card ==== */
  .a1{position:absolute;inset:0;background:
    radial-gradient(340px 190px at 330px 190px,rgba(120,169,255,.13),transparent 70%),
    repeating-linear-gradient(0deg,var(--line) 0 1px,transparent 1px 32px),
    repeating-linear-gradient(90deg,var(--line) 0 1px,transparent 1px 32px),
    var(--bg)}
  .a1 .veil{position:absolute;inset:0;background:radial-gradient(circle at 50% 48%,transparent 18%,var(--bg) 76%)}
  .a1 .arw{position:absolute;left:250px;top:178px;width:170px;height:24px;color:var(--ink);opacity:.62}
  .a1 .hint{
    position:absolute;left:250px;width:170px;top:224px;text-align:center;
    font-family:var(--mono);font-size:10px;letter-spacing:.02em;color:var(--dim);display:none;
  }
  .a1 .hint.on{display:block}
  .a1 .word{position:absolute;left:48px;bottom:44px;font-size:11px;font-weight:600;letter-spacing:.34em;color:var(--dim)}
  .a1 .ver{position:absolute;right:48px;bottom:44px;font-family:var(--mono);font-size:10px;color:var(--dim)}

  /* ==== art 03 : provenance ==== */
  .a3{position:absolute;inset:0;background:
    radial-gradient(520px 260px at 330px 150px,rgba(120,169,255,.09),transparent 72%),var(--bg)}
  .a3 .arw{position:absolute;left:262px;top:180px;width:146px;height:20px;color:var(--ink);opacity:.5}
  .a3 .hint{
    position:absolute;left:250px;width:170px;top:216px;text-align:center;
    font-family:var(--mono);font-size:9.5px;color:var(--dim);display:none;
  }
  .a3 .hint.on{display:block}
  .a3 .strip{
    position:absolute;left:48px;right:48px;bottom:48px;border-top:1px solid var(--line);
    padding-top:10px;display:flex;align-items:center;gap:14px;
    font-family:var(--mono);font-size:9.5px;color:var(--dim);
  }
  .a3 .strip .grow{flex:1}
  .a3 .badge{display:flex;align-items:center;gap:6px;color:var(--ink);opacity:.85}
  .a3 .badge i{width:5px;height:5px;border-radius:50%;display:block}

  /* ==== art 04 : poster ==== */
  .a4{position:absolute;inset:0;background:
    radial-gradient(600px 300px at 20% 100%,rgba(120,169,255,.10),transparent 70%),var(--bg)}
  .a4 .word{
    position:absolute;left:44px;bottom:24px;font-size:66px;font-weight:600;line-height:1;
    letter-spacing:-.045em;color:var(--ink);opacity:.94;
  }
  .a4 .word em{font-style:normal;opacity:.28}
  .a4 .ver{
    position:absolute;right:48px;bottom:40px;font-family:var(--mono);font-size:10px;color:var(--dim);
    border:1px solid var(--line);border-radius:99px;padding:5px 11px;
  }
  .a4 .chev{position:absolute;left:250px;top:190px;width:170px;display:flex;justify-content:space-between;color:var(--ink);opacity:.45}
  .a4 .chev svg{width:13px;height:22px}
  .a4 .hint{
    position:absolute;left:250px;width:170px;top:222px;text-align:center;font-family:var(--mono);
    font-size:9.5px;color:var(--dim);display:none;
  }
  .a4 .hint.on{display:block}
</style>
</head>
<body>

<header class="bar">
  <div class="brand">
    <div class="mark"></div>
    <div>
      <h1>Gyro · install window</h1>
      <p>Four directions for the DMG background — drawn at real geometry, 660 × 400 pt.</p>
    </div>
  </div>
  <div class="controls">
    <div class="seg" role="group" aria-label="Finder appearance">
      <button data-theme="dark" class="on">Dark Finder</button>
      <button data-theme="light">Light Finder</button>
    </div>
    <button class="tg on" id="tLabels">Finder labels</button>
    <button class="tg" id="tGeom">Geometry</button>
  </div>
</header>

<main>
  <nav class="rail" id="rail"></nav>

  <section class="stage">
    <div class="frame">
      <div class="scaler" id="scaler">
        <div class="window">
          <div class="chrome"><div class="lights"><i></i><i></i><i></i></div><div class="t">Gyro</div></div>
          <div class="finder theme-dark" id="finder">
            <div class="art" id="art"></div>

            <div class="slot" style="left:106px;top:126px"><div class="glyph"><img src="/apps/desktop/src-tauri/icons/128x128@2x.png" alt="Gyro"></div><span class="label">Gyro</span></div>
            <div class="slot" style="left:426px;top:126px"><div class="glyph">
              <svg viewBox="0 0 128 128" width="128" height="128" aria-hidden="true">
                <defs>
                  <linearGradient id="fg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7cc4ff"/><stop offset="1" stop-color="#1f6fe6"/></linearGradient>
                  <linearGradient id="fb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4fa8f7"/><stop offset="1" stop-color="#1559d6"/></linearGradient>
                </defs>
                <rect x="4" y="4" width="120" height="120" rx="27" fill="url(#fg)"/>
                <rect x="4" y="4" width="120" height="120" rx="27" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="1"/>
                <path d="M26 52a8 8 0 0 1 8-8h22.4a7 7 0 0 1 5.4 2.5l4.6 5.5H94a8 8 0 0 1 8 8v3H26z" fill="rgba(255,255,255,.6)"/>
                <path d="M26 60h76a8 8 0 0 1 8 8v24a8 8 0 0 1-8 8H34a8 8 0 0 1-8-8z" fill="url(#fb)"/>
              </svg>
            </div><span class="label">Applications</span></div>

            <svg class="geo" viewBox="0 0 660 400">
              <rect class="safe" x="48" y="44" width="564" height="312"/>
              <rect class="own" x="106" y="126" width="128" height="128"/>
              <rect class="own" x="426" y="126" width="128" height="128"/>
              <rect class="band" x="86" y="264" width="168" height="30"/>
              <rect class="band" x="406" y="264" width="168" height="30"/>
              <line class="dims" x1="48" y1="190" x2="106" y2="190"/>
              <line class="dims" x1="252" y1="190" x2="408" y2="190"/>
              <line class="dims" x1="554" y1="190" x2="612" y2="190"/>
              <text x="52" y="38">safe area 48 · 44 · 564 · 312</text>
              <text x="86" y="310" class="warn">label band — Finder paints here</text>
              <text x="112" y="122">app 170,190</text>
              <text x="430" y="122">folder 490,190</text>
            </svg>
          </div>
        </div>
      </div>
    </div>

    <div class="meta">
      <div>
        <h2><span id="mId">01</span><b id="mName">Install card</b></h2>
        <div class="notes">
          <p id="mPro"></p>
          <p class="bad" id="mCon"></p>
        </div>
        <div class="variant" id="variantRow">
          <span>Render as</span>
          <button data-variant="adhoc" class="on">ad-hoc</button>
          <button data-variant="signed">signed</button>
        </div>
      </div>
      <div class="chips" id="chips"></div>
    </div>
  </section>
</main>

<footer>
  <span class="lbl">bundle → macOS → dmg</span>
  <button id="showCfg">Show the config</button>
  <span class="sp"></span>
  <span class="kbd">1–4 switch ideas · geometry shows the safe zone</span>
</footer>
<div class="drawer" id="drawer">
  <pre id="cfg"></pre>
  <div style="display:flex;justify-content:flex-end;margin-top:12px"><button id="copy">Copy config</button></div>
</div>

<script>
const ICON_ARROW = `<svg viewBox="0 0 170 24" width="170" height="24" fill="none"><path d="M2 12h148" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity=".3"/><path d="M145 5 157 12l-12 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

const CHEV = (o) => `<svg viewBox="0 0 13 22" fill="none" style="opacity:${o}"><path d="M3 3l7 8-7 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

const IDEAS = [
  {
    id:'01', name:'Install card',
    blurb:'Dark, near-wordless. Arrow + version.',
    pro:'Nothing to translate, nothing to clip. The empty middle survives a long app name wrapping to two lines, and it reads as intentional whether macOS draws light or dark chrome around it.',
    con:'You lose the one line testers need on an ad-hoc build: "is this supposed to be scary?" If you ship 01, that sentence has to live in the release notes instead.',
    chips:['near-wordless','mono version pin','32 pt grid','dark-native'],
    variant:true,
    art(v){ return `<div class="a1">
      <div class="veil"></div>
      <div class="arw">${ICON_ARROW}</div>
      <div class="hint ${v==='adhoc'?'on':''}">right-click → Open</div>
      <div class="word">GYRO</div><div class="ver">v0.1.0</div></div>`; }
  },
  {
    id:'02', name:'Blueprint',
    blurb:'Light spec sheet. The safe zone, drawn.',
    pro:'The art is the documentation: anyone editing the background can see where icons land, where labels eat space, how much margin is left. Highest label contrast in light Finder.',
    con:'A light PNG in dark-mode Finder reads as a broken panel — white card, dark chrome. Only ship it if you accept that, or export a second dark twin.',
    chips:['light-native','measured','documents itself','22 pt grid'],
    variant:false,
    art(){ return `<div class="a1" style="background:
        radial-gradient(circle at 1px 1px,var(--dot) 1px,transparent 0) 0 0/22px 22px,var(--bg)">
      <svg style="position:absolute;inset:0;color:var(--ink)" viewBox="0 0 660 400" fill="none">
        <g stroke="currentColor" stroke-width="1" opacity=".35">
          <path d="M48 74h564"/><path d="M48 68v12M612 68v12"/>
          <path d="M74 44v312"/><path d="M68 44h12M68 356h12"/>
          <rect x="106" y="126" width="128" height="128" stroke-dasharray="4 4"/>
          <rect x="426" y="126" width="128" height="128" stroke-dasharray="4 4"/>
        </g>
        <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9" fill="currentColor" opacity=".62">
          <text x="330" y="66" text-anchor="middle">660 pt</text>
          <text x="330" y="228" text-anchor="middle">arrow corridor 252 → 408</text>
          <text x="48" y="374">1320 × 800 @2x</text>
          <text x="612" y="374" text-anchor="end">v0.1.0</text>
        </g>
      </svg>
      <svg width="170" height="20" style="position:absolute;left:250px;top:172px;color:var(--ink);opacity:.7" viewBox="0 0 170 20" fill="none"><path d="M2 10h150" stroke="currentColor" stroke-width="1"/><path d="M150 4l8 6-8 6" stroke="currentColor" stroke-width="1"/></svg>
      </div>`; }
  },
  {
    id:'03', name:'Provenance',
    blurb:'Build facts in the art. Two renders.',
    pro:'Version, commit and signing mode are baked into the window, so a tester screenshot self-reports. Ship two PNGs from one template: the ad-hoc one carries the quarantine line, the signed one stays clean.',
    con:'The strip is the first thing to break if the release workflow renames a channel — the art then lies about the artifact. Generate it in CI, never by hand.',
    chips:['two renders','mono strip','self-reporting','signing-aware'],
    variant:true,
    art(v){ return `<div class="a3">
      <div class="arw">${ICON_ARROW}</div>
      <div class="hint ${v==='adhoc'?'on':''}">right-click → Open</div>
      <div class="strip">
        <span>GYRO</span><span style="opacity:.4">/</span><span>v0.1.0</span>
        <span class="grow"></span>
        <span style="opacity:.55">4f2c9a1</span>
        <span class="badge"><i style="background:${v==='adhoc'?'#ffb454':'#3ddc84'}"></i>${v==='adhoc'?'AD-HOC':'SIGNED'}</span>
      </div></div>`; }
  },
  {
    id:'04', name:'Poster',
    blurb:'Big wordmark, dotted chevron.',
    pro:'Puts the name in the one band that is never covered — under the labels, above the window edge. Reads at a glance in a Downloads folder full of thumbnails, and holds up at 50% scale.',
    con:'Competes with the icon for attention, and the wordmark sets a floor on how many weights you keep in sync with the app UI. Most brand debt for the least install guidance.',
    chips:['type-led','high contrast','66 pt wordmark','most brand'],
    variant:true,
    art(v){ return `<div class="a4">
      <div class="chev">${CHEV(.55)}${CHEV(.4)}${CHEV(.25)}</div>
      <div class="hint ${v==='adhoc'?'on':''}">right-click → Open</div>
      <div class="word">Gyro<em>.</em></div>
      <div class="ver">v0.1.0 · macOS 14+</div></div>`; }
  }
];

const CFG = `"bundle": {
  "macOS": {
    "signingIdentity": "-",
    "dmg": {
      "background": "icons/dmg-background@2x.png",
      "windowSize": { "width": 660, "height": 400 },
      "appPosition": { "x": 170, "y": 190 },
      "applicationFolderPosition": { "x": 490, "y": 190 },
      "iconSize": 128
    }
  }
}`;

const state = { idea:0, variant:'adhoc', theme:'dark', labels:true, geo:false };
const qs = new URLSearchParams(location.search);
if(qs.has('idea')) state.idea = Math.min(3, Math.max(0, (parseInt(qs.get('idea'),10) || 1) - 1));
if(qs.get('theme') === 'light') state.theme = 'light';
if(qs.get('variant') === 'signed') state.variant = 'signed';
state.geo = qs.get('geo') === '1';
state.labels = qs.get('labels') !== '0';

const rail = document.getElementById('rail');
rail.innerHTML = IDEAS.map((it,i)=>`
  <button class="idea ${i===0?'on':''}" data-i="${i}">
    <span class="n">${it.id}</span>
    <span><b>${it.name}</b><small>${it.blurb}</small></span>
  </button>`).join('') + `
  <div class="foot">
    Icons sit at <code>170,190</code> and <code>490,190</code>.
    Labels land at <code>y≈276</code> and macOS paints them over your art.
    Everything on the right is drawn in that frame.
  </div>`;

function render(){
  const it = IDEAS[state.idea];
  const finder = document.getElementById('finder');
  document.getElementById('art').innerHTML = it.art(state.variant);

  finder.classList.toggle('theme-dark', state.theme==='dark');
  finder.classList.toggle('theme-light', state.theme==='light');
  finder.classList.toggle('nolabels', !state.labels);
  finder.classList.toggle('showgeo', state.geo);

  document.getElementById('mId').textContent = it.id;
  document.getElementById('mName').textContent = it.name;
  document.getElementById('mPro').innerHTML = `<b>Works.</b> ${it.pro}`;
  document.getElementById('mCon').innerHTML = `<b>Breaks.</b> ${it.con}`;
  document.getElementById('chips').innerHTML = it.chips.map(c=>`<span class="chip">${c}</span>`).join('');
  document.getElementById('variantRow').classList.toggle('show', it.variant);
  document.querySelectorAll('#variantRow button').forEach(b=>b.classList.toggle('on', b.dataset.variant===state.variant));
  document.querySelectorAll('.idea').forEach(b=>b.classList.toggle('on', +b.dataset.i===state.idea));
  document.querySelectorAll('.seg button').forEach(x=>x.classList.toggle('on', x.dataset.theme===state.theme));
  document.getElementById('tLabels').classList.toggle('on', state.labels);
  document.getElementById('tGeom').classList.toggle('on', state.geo);
  history.replaceState(null,'','?'+new URLSearchParams({idea:state.idea+1,theme:state.theme,variant:state.variant,geo:state.geo?1:0,labels:state.labels?1:0}));

  const esc = CFG.replace(/&/g,'&amp;').replace(/</g,'&lt;');
  document.getElementById('cfg').innerHTML = esc
    .replace(/&quot;/g,'"')
    .replace(/"([a-zA-Z]+)":/g,'<span class="k">"$1"</span>:')
    .replace(/(: )"([^"]*)"/g,'$1<span class="s">"$2"</span>')
    .replace(/(: )(-?\d+)/g,'$1<span class="n">$2</span>');
  fit();
}

function fit(){
  const frame = document.querySelector('.frame');
  const s = Math.min(1.42, (frame.clientWidth - 32) / 660, (frame.clientHeight - 16) / 438);
  const k = Math.max(.45, s);
  const scaler = document.getElementById('scaler');
  scaler.style.width = (660*k)+'px';
  scaler.style.height = (438*k)+'px';
  document.querySelector('.window').style.transform = `scale(${k})`;
}
addEventListener('resize', fit);

rail.addEventListener('click', e=>{
  const b = e.target.closest('.idea'); if(!b) return;
  state.idea = +b.dataset.i; render();
});
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{
  state.theme = b.dataset.theme;
  document.querySelectorAll('.seg button').forEach(x=>x.classList.toggle('on', x===b));
  render();
});
document.getElementById('variantRow').addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  state.variant = b.dataset.variant; render();
});
document.getElementById('tLabels').onclick = e=>{
  state.labels = !state.labels; e.currentTarget.classList.toggle('on', state.labels); render();
};
document.getElementById('tGeom').onclick = e=>{
  state.geo = !state.geo; e.currentTarget.classList.toggle('on', state.geo); render();
};
document.getElementById('showCfg').onclick = () => {
  const d = document.getElementById('drawer');
  d.classList.toggle('open');
  document.getElementById('showCfg').textContent = d.classList.contains('open') ? 'Hide the config' : 'Show the config';
};
document.getElementById('copy').onclick = async () => {
  const btn = document.getElementById('copy');
  try { await navigator.clipboard.writeText(CFG); btn.textContent = 'Copied'; }
  catch { btn.textContent = 'Select manually'; }
  setTimeout(()=>btn.textContent='Copy', 1400);
};
addEventListener('keydown', e=>{
  const n = parseInt(e.key,10);
  if(n>=1 && n<=4){ state.idea = n-1; render(); }
});

document.documentElement.style.setProperty('--dot','rgba(20,60,120,.16)');
requestAnimationFrame(()=>{ render(); setTimeout(fit, 60); });
</script>
</body>
</html>
