<!doctype html><meta charset="utf-8"><title>Gyro — In orbit</title>
<style>@font-face{font-family:Tight;src:url('../../apps/desktop/public/fonts/inter-tight-latin.woff2');font-weight:100 900}@font-face{font-family:Inter;src:url('../../apps/desktop/public/fonts/inter-latin.woff2');font-weight:100 900}*{margin:0}body{background:#090b0d;overflow:hidden}canvas{width:100vw;height:100vh;object-fit:contain}</style><canvas id="c" width="1920" height="1080"></canvas>
<script>
const c=document.querySelector('canvas'),g=c.getContext('2d');
const W=1920,H=1080,ink='#090b0d',white='#f5f2ec',orange='#ff754f';
const clamp=x=>Math.max(0,Math.min(1,x)), ease=x=>1-Math.pow(1-clamp(x),4), smooth=x=>{x=clamp(x);return x*x*(3-2*x)}, lerp=(a,b,x)=>a+(b-a)*x;
const assets={};
function text(s,x,y,size=100,color=white,align='left',weight=600){g.fillStyle=color;g.font=`${weight} ${size}px Tight`;g.textAlign=align;g.textBaseline='middle';g.fillText(s,x,y)}
function line(x,y,x2,y2,col,width=1){g.strokeStyle=col;g.lineWidth=width;g.beginPath();g.moveTo(x,y);g.lineTo(x2,y2);g.stroke()}
function label(s,x,y,col='#93979b',align='left'){g.font='500 22px Inter';g.textBaseline='middle';g.textAlign=align;g.fillStyle=col;g.fillText(s,x,y)}
function bg(t,light=false){g.fillStyle=light?'#edeae2':ink;g.fillRect(0,0,W,H);if(!light){let r=g.createRadialGradient(1230,530,10,1100,530,1000);r.addColorStop(0,'#26302e');r.addColorStop(.6,'#111619');r.addColorStop(1,ink);g.fillStyle=r;g.fillRect(0,0,W,H)}g.fillStyle=light?'#0000000b':'#ffffff08';for(let x=64;x<W;x+=48)for(let y=56;y<H;y+=48)g.fillRect(x,y,1.3,1.3);}
function chromeRing(t,cx,cy,r,idx,alpha=1,spread=1){let pts=[];const a=t*.56+idx*1.047, tilt=.55+idx*.62;for(let j=0;j<=180;j++){let p=j/180*Math.PI*2;let x=Math.cos(p)*r,y=Math.sin(p)*r;let z=y*Math.sin(tilt),yy=y*Math.cos(tilt);let xx=x*Math.cos(a)+z*Math.sin(a),zz=-x*Math.sin(a)+z*Math.cos(a);let rot=-.35;let X=xx*Math.cos(rot)-yy*Math.sin(rot),Y=xx*Math.sin(rot)+yy*Math.cos(rot);const k=1400/(1400-zz);pts.push([cx+X*k*spread,cy+Y*k*spread,zz]);}g.save();g.globalAlpha=alpha;g.lineCap='round';for(let j=0;j<180;j++){let p=pts[j],q=pts[j+1],lum=Math.round(100+130*Math.pow(Math.max(0,Math.cos(j/180*Math.PI*2+a)),8)+38*(p[2]/r));g.strokeStyle=idx===1?`rgb(${Math.min(255,lum+75)},${Math.max(45,lum*.48)},${Math.max(25,lum*.26)})`:`rgb(${lum},${lum+5},${lum+4})`;g.lineWidth=(idx===1?26:18)*(1+p[2]/2400);g.beginPath();g.moveTo(p[0],p[1]);g.lineTo(q[0],q[1]);g.stroke();}g.restore()}
function rings(t,x,y,r,a=1,s=1){for(let i=0;i<3;i++)chromeRing(t,x,y,r*(1-i*.095),i,a,s)}
function meta(t,light=false){g.fillStyle=light?'#edeae2':ink;g.fillRect(0,1006,1920,74);const col=light?'#565852':'#929997';label('GYRO  /  INTRODUCING',80,65,col);label('CHAT  /  CLI  /  IDE',1840,65,col,'right');line(80,101,1840,101,light?'#00000025':'#ffffff20');line(80,1005,1840,1005,light?'#00000025':'#ffffff20');label('ONE WORKSPACE. YOUR AGENTS.',80,1040,col);label('SOON',1840,1040,col,'right');g.fillStyle=orange;g.fillRect(80,1004,1760*clamp(t/15),2)}
function maskedWord(s,x,y,size,p,col=white,align='left'){g.save();g.beginPath();g.rect(0,y-size*.65,W,size*1.32);g.clip();text(s,x,y+(1-ease(p))*size*1.4,size,col,align);g.restore()}
function rounded(x,y,w,h,r){g.beginPath();g.roundRect(x,y,w,h,r)}
window.draw=function(t){g.clearRect(0,0,W,H);bg(t);
if(t<3){let exit=ease((t-2.6)/.4);rings(t*1.5,1340+exit*450,550,340,1,1+.25*exit);label('A NEW CENTER OF GRAVITY',100,265,orange);maskedWord('Meet',94,432,146,(t+.23)/.6);maskedWord('Gyro.',80-exit*1100,655,300,(t+.1)/.8);label('Your agents. In orbit.',100,850);g.fillStyle=orange;g.beginPath();g.arc(1340,550,13,0,Math.PI*2);g.fill();}
else if(t<6.25){let u=t-3;bg(t,true);let stage=Math.min(2,Math.floor(u/.95));let word=['Chat.','CLI.','IDE.'][stage];let local=u-stage*.95;let offsets=[0,1,2];for(let i of offsets){let yy=290+i*230;g.save();g.globalAlpha=i===stage?1:.15;maskedWord(['Chat.','CLI.','IDE.'][i],140+((i===stage)?(1-ease(local/.35))*160:0),yy,210,i===stage?local/.32:1,ink);g.restore();}let px=1330;g.save();g.translate(px,540);g.rotate(-.25+u*.22);g.strokeStyle=ink;g.lineWidth=3;for(let i=0;i<3;i++){g.beginPath();g.ellipse(0,0,280,90+i*66,i*Math.PI/3,0,Math.PI*2);g.stroke()}g.restore();text('↗',1330,540,220,ink,'center');label('THREE WAYS TO WORK.',1220,874,'#575b58');}
else if(t<8.5){let u=t-6.25;let p=ease(u/.8);rings(t,960,540,390,.48,1+.25*(1-p));let names=['Chat','CLI','IDE'];for(let i=0;i<3;i++){let a=i*Math.PI*2/3-.5;let x=960+Math.cos(a)*650*(1-p),y=540+Math.sin(a)*340*(1-p);g.save();g.globalAlpha=1-smooth((u-.4)/.5);text(names[i],x,y,75,white,'center');g.restore()}g.save();g.globalAlpha=smooth((u-.4)/.4);maskedWord('One',960,430,186,(u-.4)/.6,white,'center');maskedWord('workspace.',960,635,206,(u-.52)/.6,white,'center');g.restore();}
else if(t<11.75){let u=t-8.5,p=ease(u/.75),out=smooth((u-2.9)/.35);label('BUILT AROUND YOUR FLOW',100,175,orange);maskedWord('Stay in the same session.',100,270,100,u/.6);let iw=1050,ih=iw*assets.ui.height/assets.ui.width;g.save();g.translate(1000,710+150*(1-p));g.rotate((1-p)*-.065);g.scale(.9+.1*p+.012*u,.9+.1*p+.012*u);g.shadowColor='#000000aa';g.shadowBlur=80;g.shadowOffsetY=30;rounded(-iw/2,-ih/2,iw,ih,18);g.fillStyle='#1e2428';g.fill();g.clip();g.drawImage(assets.ui,-iw/2,-ih/2,iw,ih);g.restore();let grad=g.createLinearGradient(0,890,0,1006);grad.addColorStop(0,'#090b0d00');grad.addColorStop(1,ink);g.fillStyle=grad;g.fillRect(0,890,W,116);if(out>0){g.fillStyle=orange;g.beginPath();g.arc(960,540,out*1200,0,Math.PI*2);g.fill();}}
else {let u=t-11.75,p=ease(u/.8);bg(t);rings(t*.55,960,510,390,.32,1.1);g.save();g.translate(960,505);g.scale(.7+.3*p,.7+.3*p);g.globalAlpha=p;g.drawImage(assets.logo,-364,-98,170,170);text('Gyro',-156,0,224);g.restore();g.globalAlpha=ease((u-.35)/.7);text('Chat, CLI & IDE. In one orbit.',960,690,48,white,'center');g.globalAlpha=ease((u-.9)/.6);text('Soon.',960,824,55,orange,'center');g.globalAlpha=1;label('usegyro.io',960,924,'#9ca3a2','center');}
meta(t,t>=3&&t<6.25);
};
Promise.all([document.fonts.load('600 100px Tight'),document.fonts.load('500 22px Inter'),...Object.entries({logo:'../../docs/media/shared/gyro-logo.png',ui:'../../docs/screenshots/readme/workspace-review.webp'}).map(([k,url])=>new Promise(resolve=>{let i=new Image;i.onload=()=>{assets[k]=i;resolve()};i.src=url}))]).then(()=>{window.draw(0);document.body.dataset.ready='1';if(!location.search.includes('render')){let start=performance.now();function tick(now){draw(((now-start)/1000)%15);requestAnimationFrame(tick)}requestAnimationFrame(tick)}});
</script>
