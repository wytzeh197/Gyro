<!doctype html><html lang="en"><meta charset="utf-8"><title>Gyro — All in one</title><style>
@font-face{font-family:Inter;src:url('../../apps/desktop/public/fonts/inter-latin.woff2');font-weight:100 900}@font-face{font-family:Tight;src:url('../../apps/desktop/public/fonts/inter-tight-latin.woff2');font-weight:100 900}
*{box-sizing:border-box}html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#f7f9fc;color:#172535;font-family:Inter,sans-serif;-webkit-font-smoothing:antialiased}#wash{position:absolute;inset:-300px;background:radial-gradient(ellipse at 70% 65%,#e9f1ffb0,transparent 58%),#f8fafc}#stage{position:absolute;inset:0;perspective:2200px;isolation:isolate}.center{position:absolute;left:0;width:100%;text-align:center;letter-spacing:-3px;font-size:76px;font-weight:450;line-height:1.1}#intro{top:476px}#bring{top:476px}#icons{position:absolute;inset:0;perspective:1600px}.icon{position:absolute;width:100px;height:100px;left:910px;top:490px;display:grid;place-items:center;border-radius:24px;background:#ffffffd9;border:1px solid #dbe4ef80;box-shadow:0 15px 38px #2d4a740b;will-change:transform}.icon img{width:56px;height:56px}.cam{position:absolute;inset:0;transform-style:preserve-3d;perspective:1800px;transform-origin:960px 570px}.pane{position:absolute;background:white;border-radius:14px;overflow:hidden;box-shadow:0 2px 4px #18325304,0 18px 46px #1832530a;border:1px solid #dfe7f06b;transform-origin:50% 50%;will-change:transform}.pane img{width:100%;display:block}#composer{width:1060px;left:430px;top:552px;border-radius:23px}#prompt{width:950px;left:485px;top:402px;border-radius:20px;background:transparent;box-shadow:none;border:none}#terminal{width:1050px;left:435px;top:425px}#editor{width:1010px;left:455px;top:315px}.tabs{position:absolute;left:585px;top:240px;display:flex;gap:84px;font-size:28px;letter-spacing:-.7px}.tab{width:185px;text-align:center;color:#8f9bac}.tab.active{color:#172535}#under{position:absolute;left:0;bottom:-19px;width:185px;height:2px;background:#4283e1;transform-origin:left}#shell{position:absolute;left:275px;top:345px;width:1370px;height:566px;border:1px solid #dce6f0;border-radius:23px;background:#ffffffbf;box-shadow:0 25px 65px #244b7910}#shellbrand{position:absolute;top:22px;left:27px;display:flex;gap:10px;align-items:center;font-size:22px}#shellbrand img{width:27px;height:27px}#all{top:183px;color:#3c79cb;font-size:74px}#dot{position:absolute;width:12px;height:12px;left:0;top:0;border-radius:50%;background:#4686e3;box-shadow:0 0 0 7px #4686e30a;z-index:10}#lockup{position:absolute;left:755px;top:455px;display:flex;align-items:center;gap:25px;transform-origin:center}#lockup img{width:91px;height:91px}#lockup span{font-size:98px;font-weight:450;letter-spacing:-5px}#soon{top:620px;font-size:30px;letter-spacing:-.7px;color:#567593}#url{top:896px;font-size:21px;letter-spacing:-.4px;color:#8b9aac}
</style><body><div id="wash"></div><div id="stage">
<div id="intro" class="center">Meet Gyro.</div><div id="bring" class="center">Bring your own.</div><div id="icons">
<div class="icon" id="i0"><img src="assets/claude.svg"></div><div class="icon" id="i1"><img src="assets/codex.svg"></div><div class="icon" id="i2"><img src="assets/gemini.svg"></div><div class="icon" id="i3"><img src="assets/grok.svg"></div><div class="icon" id="i4"><img src="assets/kimi.svg"></div><div class="icon" id="i5"><img src="assets/ollama.svg"></div></div>
<div id="ui" class="cam"><div id="shell"><div id="shellbrand"><img src="assets/gyro.png">Gyro</div></div><div id="nav" class="tabs"><span class="tab" id="tab0">Chat</span><span class="tab" id="tab1">Terminal</span><span class="tab" id="tab2">Workspace</span><i id="under"></i></div><div class="pane" id="prompt"><img src="assets/prompt.png"></div><div class="pane" id="composer"><img src="assets/composer.png"></div><div class="pane" id="terminal"><img src="assets/terminal.png"></div><div class="pane" id="editor"><img src="assets/editor.png"></div></div>
<div id="all" class="center">All in one.</div><div id="dot"></div><div id="lockup"><img src="assets/gyro.png"><span>Gyro.</span></div><div id="soon" class="center">Coming soon.</div><div id="url" class="center">usegyro.io</div></div>
<script>
const $=id=>document.getElementById(id),C=x=>Math.max(0,Math.min(1,x)),E=x=>1-Math.pow(1-C(x),4),S=x=>{x=C(x);return x*x*(3-2*x)},L=(a,b,p)=>a+(b-a)*p;
const show=(id,opacity=1,transform='',blur=0)=>{let e=$(id);e.style.opacity=C(opacity);e.style.transform=transform;e.style.filter=blur>0?`blur(${blur}px)`:''};
function pane(id,{x=0,y=0,s=1,rx=0,ry=0,rz=0,a=1,blur=0}={}){show(id,a,`translate3d(${x}px,${y}px,0) rotateX(${rx}deg) rotateY(${ry}deg) rotateZ(${rz}deg) scale(${s})`,blur)}
function reset(){for(let id of ['intro','bring','icons','ui','all','dot','lockup','soon','url','shell','nav','composer','prompt','terminal','editor'])show(id,0);}
window.draw=t=>{reset();const final=C((t-12.05)/.8);show('wash',1,`translate(${Math.sin(t*.5)*36}px,${Math.cos(t*.4)*20}px)`);
// One small line of type. Acceleration, then a long clear reading tail.
if(t<1.95){let p=E((t+.35)/.75),q=S((t-1.2)/.35);show('intro',1-q,`translateY(${22*(1-p)-q*35}px) scale(${.94+.06*p+.025*t})`,3*(1-p)+4*q)}
// Six independent curved trajectories. Icons contract to a single blue point.
if(t>=1.35&&t<4.55){let u=t-1.35,gather=S((t-3.62)/.70);let p=E((u-.28)/.65);show('bring',p*(1-gather),`translateY(${28*(1-p)-gather*18}px) scale(${1+.02*u})`,2*(1-p));show('icons',1);for(let i=0;i<6;i++){let ip=E((u-i*.06)/.8),angle=i*Math.PI/3-.32+u*.17;let radius=1.25-.25*ip;let x=Math.cos(angle)*435*radius,y=Math.sin(angle)*243*radius;let depth=Math.sin(angle)*55;let gx=L(x,0,gather),gy=L(y,0,gather);show('i'+i,ip*(1-S((gather-.72)/.28)),`translate3d(${gx}px,${gy}px,${depth*(1-gather)}px) rotate(${(Math.sin(angle)*9+25*(1-ip))*(1-gather)}deg) scale(${(.72+.28*ip)*(1-.78*gather)})`,3*(1-ip));}let dp=S((t-3.95)/.35);let travel=E((t-4.15)/.55);show('dot',dp*(1-S((t-4.55)/.3)),`translate(${L(954,1438,travel)}px,${L(534,662,travel)-Math.sin(travel*Math.PI)*100}px) scale(${1+Math.sin(travel*Math.PI)*.6})`);}
// Follow the blue point toward one floating composer.
if(t>=4.05&&t<6.45){let u=t-4.05,p=E(u/.75),out=S((t-5.92)/.53);show('ui',1,`translateX(${L(120,-40,E(u/2.4))}px) translateY(${L(40,-15,E(u/2.4))}px) scale(${L(.80,1.13,E(u/2.4))})`);show('nav',p*(1-out));let start=.24;pane('composer',{y:125*(1-p)+out*100,s:1-.1*(1-p),rx:L(17,0,p),ry:L(-13,5,E(u/2.4)),a:p*(1-out),blur:2*(1-p)});let prompt=E((u-.55)/.65);pane('prompt',{y:38*(1-prompt)-out*60,s:1,a:prompt*(1-out)});$('prompt').style.clipPath=`inset(0 ${100*(1-prompt)}% 0 0)`;}
// A forward glide into Terminal. The card turns toward camera as it arrives.
if(t>=5.95&&t<8.25){let u=t-5.95,p=E(u/.65),out=S((t-7.68)/.57);show('ui',1,`translate(${L(100,-95,S(u/2.3))}px,${L(55,-30,S(u/2.3))}px) scale(${L(.91,1.11,S(u/2.3))})`);show('nav',1);pane('terminal',{x:190*(1-p)-out*300,y:55*(1-p)+out*45,ry:18*(1-p)-u*4,s:.94+.06*p,a:p*(1-out),blur:3*(1-p)+out*2});$('under').style.transform=`translateX(${269*E((t-5.95)/.6)}px)`;}
// Match direction into the editor, then open the workspace around it.
if(t>=7.72&&t<10.25){let u=t-7.72,p=E(u/.7);show('ui',1,`translate(${L(110,-25,S(u/2.53))}px,${L(20,-35,S(u/2.53))}px) scale(${L(.9,1.04,S(u/2.53))})`);show('nav',1-S((t-9.78)/.45));pane('editor',{x:170*(1-p),y:70*(1-p),ry:-18*(1-p)+u*2.3,s:.88+.07*p,a:p,blur:2*(1-p)});$('under').style.transform=`translateX(${269+269*E((t-7.72)/.6)}px)`;}
// Pull back: the same components join within a single quiet shell.
if(t>=9.80&&t<12.85){let u=t-9.8,p=S(u/.9),collapse=S((t-12.03)/.70);show('ui',1-collapse,`translateY(${-20+u*5}px) scale(${(1.04-.12*E(u/2.2))*(1-.87*collapse)}) rotateX(${2*Math.sin(u)*(1-collapse)}deg)`);show('shell',E((u-.15)/.7));show('nav',0);pane('editor',{x:L(0,332,p),y:L(0,0,p),s:L(.95,.59,p),ry:L(5,0,p),a:1});pane('prompt',{x:-335*p,y:22*p,s:L(.3,.58,p),a:E(u/.65)});$('prompt').style.clipPath='none';pane('composer',{x:-333*p,y:210*p,s:L(.3,.54,p),a:E((u-.1)/.65)});pane('terminal',{x:-330*p,y:35*p,s:L(.35,.54,p),a:E((u-.05)/.65)});show('all',E(u/.6)*(1-collapse),`translateY(${18*(1-E(u/.6))-collapse*30}px)`);}
// The workspace becomes the mark. A restrained brand landing.
if(t>=12.08){let u=t-12.08,p=E(u/.8);show('lockup',p,`translateY(${30*(1-p)}px) scale(${.73+.27*p+.015*u})`,4*(1-p));show('soon',E((u-.42)/.6),`translateY(${17*(1-E((u-.42)/.6))}px)`);show('url',E((u-.7)/.7));}
// Continuous camera across overlaps: incoming shots inherit the outgoing pose.
if(t>=5.95&&t<7.72){const a=E(1.9/2.4),p=S((t-5.95)/1.77);$('ui').style.transform=`translate(${L(L(120,-40,a),-45,p)}px,${L(L(40,-15,a),-25,p)}px) scale(${L(L(.80,1.13,a),1.06,p)})`;}
if(t>=7.72&&t<9.8){const p=S((t-7.72)/2.08);$('ui').style.transform=`translate(${L(-45,0,p)}px,${L(-25,-20,p)}px) scale(${L(1.06,1.04,p)})`;}
for(let i=0;i<3;i++)$('tab'+i).className='tab'+((t<5.95?0:t<7.72?1:2)===i?' active':'');if(t<5.95)$('under').style.transform='translateX(0)';
};
Promise.all([document.fonts.load('450 76px Inter'),document.fonts.load('400 30px Inter'),...Array.from(document.images).map(i=>i.decode())]).then(()=>{draw(0);document.body.dataset.ready='1';if(!location.search.includes('render')){let st=performance.now();function loop(now){draw((now-st)/1000%15);requestAnimationFrame(loop)}requestAnimationFrame(loop)}});
</script></body></html>
