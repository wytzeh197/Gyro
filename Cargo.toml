[workspace]
members = [
  "crates/gyro-core",
  "crates/gyro-cli",
  "apps/desktop/src-tauri",
]
resolver = "2"

[workspace.package]
authors = ["Gyro contributors"]
edition = "2021"
homepage = "https://usegyro.io/"
license = "Apache-2.0"
repository = "https://github.com/wytzeh197/Gyro"
rust-version = "1.78"
version = "0.1.0-preview.2"

[workspace.dependencies]
anyhow = "1.0"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = "4.5"
ctrlc = "3.4"
dirs = "5.0"
diffy = "0.4"
keyring = { version = "3.6", features = ["apple-native"] }
libc = "0.2"
notify = "7.0"
rand = "0.8"
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
ureq = { version = "2.12", features = ["json"] }
url = "2.5"
uuid = { version = "1.10", features = ["v4", "serde"] }

# Dependencies (SQLite, serde_json, walkdir, notify) run unoptimized in
# `tauri dev` otherwise, which makes the dev app feel far slower than release.
# Note: `"*"` matches Gyro's own crates too, so those are pinned to a cheaper
# level in the next block instead of silently inheriting -O2.
[profile.dev.package."*"]
opt-level = 2
# ...but dependencies carry no debug info. With ~474 crates in the graph, full
# DWARF for every optimized dependency was the largest single cost of a cold
# build and most of `target/debug/deps` on disk. Symbols survive, so backtraces
# still name dependency frames; only their file:line is lost.
debug = false

[profile.dev]
# Gyro's own crates keep line tables, so breakpoints and backtraces still land
# on real lines, without the type/variable info that triples object size.
debug = 1

# Gyro's own crates: no optimization in dev. Measured on `gyro-core`, clean
# rebuild of the crate alone: opt-level 0 = 5.8 s wall / 5.3 s CPU,
# opt-level 1 = 28.9 s wall / 96.5 s CPU. Optimizer passes also run for
# `cargo check`, so anything above 0 costs ~5x on the loop you use all day.
# If `tauri dev` ever feels sluggish, raise only this crate to 1 - never the
# `"*"` block, which also covers 474 dependencies.
[profile.dev.package.gyro-core]
opt-level = 0

[profile.dev.package.gyro-cli]
opt-level = 0

[profile.dev.package.gyro-desktop]
opt-level = 0

# Shipping builds trade a longer (CI-only) link for a leaner, faster binary.
[profile.release]
lto = "thin"
codegen-units = 1
