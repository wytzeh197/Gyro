name: CI

on:
  pull_request:
  push:
    branches: [main, v0.1.0]

jobs:
  node:
    name: Node
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      # Compared against scripts/workbench-smoke-baseline.json, so this fails
      # only on a check that was passing when the baseline was recorded.
      - run: pnpm smoke:workbench
      # Drives the Canvas preview in a headless Chromium against the dev
      # server; scripts/run-canvas-preview-browser.mjs boots Vite itself.
      - run: pnpm test:canvas-browser
      - run: pnpm release:check
        # Source validation checks the intended signed preview notes. The tagged
        # release job resolves the actual signing mode and verifies the artifacts.
        env:
          GYRO_MACOS_SIGNING: developer-id

  rust:
    name: Rust
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
      - name: Install ripgrep for workspace search tests
        run: brew install ripgrep
      - name: Build confined Code Mode worker for native tests
        run: pnpm --filter @gyro-dev/codemode build
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked -- --test-threads=4
      - run: cargo build --locked -p gyro-cli
      - run: node scripts/check-cli-release-packaging.mjs

  tauri:
    name: Tauri build smoke
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @gyro-dev/desktop build
      - name: Install ripgrep for workspace search tests
        run: brew install ripgrep
      - name: Build confined Code Mode worker for native tests
        run: pnpm --filter @gyro-dev/codemode build
      - run: cargo test --workspace --locked -- --test-threads=4
      # The packaged app is built and actually launched: the debug-only
      # browser and LSP smoke harnesses (browser_smoke.rs, lsp_smoke.rs) run
      # against the bundle and must write ok reports.
      - name: Build debug app bundle
        run: pnpm --filter @gyro-dev/desktop tauri build --debug --bundles app --no-sign --ci -- --locked
      # The LSP smoke starts rust-analyzer through the app's language-server
      # manager; rust-analyzer is not in the toolchain's default profile.
      - name: Install rust-analyzer
        run: rustup component add rust-analyzer
      - name: Native smoke (browser + language server)
        run: node scripts/run-native-smoke.mjs
      - name: Build isolated Keychain probe
        run: cargo build --locked -p gyro-core --example cloud_keychain_acceptance
      - name: Isolated native Keychain mechanism
        timeout-minutes: 4
        run: ./target/debug/examples/cloud_keychain_acceptance
