name: Publish Homebrew CLI

# Validates the generated Formula by installing the released CLI on both macOS
# architectures. Publishing to wytzeh197/homebrew-tap is not done here: pushing
# to another repository needs a personal access token, and the one this job
# expected was never configured, so the tap silently stayed on an old version
# while this workflow still reported success. The tap now pulls the Formula
# itself (sync-gyro-formula.yml there) and gates on a successful run of this
# workflow for the tag, so keep this file name stable.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published Gyro release tag to validate
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: homebrew-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare published Formula
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false }}
    runs-on: ubuntu-latest
    steps:
      - name: Download generated Formula
        run: |
          mkdir -p release-assets
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern gyro.rb \
            --dir release-assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
      - name: Validate Formula metadata
        run: |
          set -euo pipefail
          FORMULA="release-assets/gyro.rb"
          VERSION="${TAG#v}"
          test "$TAG" != "$VERSION"
          test -s "$FORMULA"
          ! grep -q "REPLACE_WITH" "$FORMULA"
          grep -F 'homepage "https://github.com/wytzeh197/Gyro"' "$FORMULA"
          grep -F "version \"$VERSION\"" "$FORMULA"
          grep -F 'url "https://github.com/wytzeh197/Gyro/releases/download/v#{version}/gyro-cli-#{version}-aarch64-apple-darwin.tar.gz"' "$FORMULA"
          grep -F 'url "https://github.com/wytzeh197/Gyro/releases/download/v#{version}/gyro-cli-#{version}-x86_64-apple-darwin.tar.gz"' "$FORMULA"
          test "$(grep -Ec '^[[:space:]]+sha256 "[0-9a-f]{64}"$' "$FORMULA")" -eq 2
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
      - name: Preserve the exact Formula for validation and publish
        uses: actions/upload-artifact@v4
        with:
          name: published-homebrew-formula
          path: release-assets/gyro.rb
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  validate:
    name: Validate CLI (${{ matrix.architecture }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: Apple Silicon
            runner: macos-15
          - architecture: Intel
            runner: macos-15-intel
    steps:
      - name: Download prepared Formula
        uses: actions/download-artifact@v4
        with:
          name: published-homebrew-formula
          path: release-assets
      - name: Install and exercise the released CLI
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          brew tap-new gyro/release-validation
          FORMULA_DIRECTORY="$(brew --repository gyro/release-validation)/Formula"
          mkdir -p "$FORMULA_DIRECTORY"
          cp "$PWD/release-assets/gyro.rb" "$FORMULA_DIRECTORY/gyro.rb"
          brew install --formula gyro/release-validation/gyro
          gyro --version | grep -F "$VERSION"
          gyro completions zsh > "$RUNNER_TEMP/_gyro"
          gyro completions bash > "$RUNNER_TEMP/gyro.bash"
          gyro completions fish > "$RUNNER_TEMP/gyro.fish"
          test -s "$RUNNER_TEMP/_gyro"
          test -s "$RUNNER_TEMP/gyro.bash"
          test -s "$RUNNER_TEMP/gyro.fish"
          gyro doctor --json | jq -e '.schema == "gyro.cli.v1" and (.checks | type == "array")'
          brew test gyro/release-validation/gyro
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
