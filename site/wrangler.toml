# Retired. usegyro.io is published from the private gyro-website repository.
# pnpm site:deploy refuses. This name is not the production worker, so a
# direct wrangler deploy from here cannot replace the live site.
# Auth stays local (wrangler login / CLOUDFLARE_API_TOKEN). Do not commit account IDs or tokens.
name = "gyro-retired-app-site"
compatibility_date = "2026-07-22"
workers_dev = true

[assets]
directory = "dist"
not_found_handling = "404-page"
