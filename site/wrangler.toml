# Cloudflare Worker that serves the public download site at usegyro.io.
# Deploy: pnpm site:deploy
# Auth stays local (wrangler login / CLOUDFLARE_API_TOKEN). Do not commit account IDs or tokens.
name = "usegyro"
compatibility_date = "2026-07-22"
workers_dev = true

[assets]
directory = "dist"
not_found_handling = "404-page"
